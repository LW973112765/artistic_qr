name: artistic_qr
description: >-
  Customizable artistic QR codes with module shapes, gradients, image
  halftone, logo blend, 3D effects, animation, and zero dependencies.
version: 1.0.1
homepage: https://github.com/deaa-jahjah/artistic_qr
repository: https://github.com/deaa-jahjah/artistic_qr
issue_tracker: https://github.com/deaa-jahjah/artistic_qr/issues
license: MIT

screenshots:
  - description: "Colored halftone QR code"
    path: doc/hero_halftone.png
  - description: "Logo color blend QR code"
    path: doc/hero_blend.png
  - description: "Scan me frame QR code"
    path: doc/hero_frame.png

environment:
  sdk: ^3.10.4
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: decoder used to verify generated codes are scannable.
  zxing2: ^0.2.3
  # Test-only: PNG decoding for round-trip tests.
  image: ^4.3.0
  # Test-only: SVG well-formedness checks.
  xml: ^6.5.0

topics:
  - qr
  - qr-code
  - widgets
  - barcode
  - image
